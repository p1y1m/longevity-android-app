name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.1
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure stable release signing
        env:
          LONGEVITY_KEYSTORE_BASE64: ${{ secrets.LONGEVITY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$LONGEVITY_KEYSTORE_BASE64"
          printf '%s' "$LONGEVITY_KEYSTORE_BASE64" | base64 --decode > android/app/longevity-release.jks
          python3 .github/scripts/configure_android_signing.py

      - name: Build standalone release APK
        working-directory: android
        env:
          LONGEVITY_KEYSTORE_PATH: ${{ github.workspace }}/android/app/longevity-release.jks
          LONGEVITY_KEYSTORE_PASSWORD: ${{ secrets.LONGEVITY_ANDROID_KEYSTORE_PASSWORD }}
          LONGEVITY_KEY_ALIAS: ${{ secrets.LONGEVITY_ANDROID_KEY_ALIAS }}
          LONGEVITY_KEY_PASSWORD: ${{ secrets.LONGEVITY_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and compatibility
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APK_PATH"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" | tee apk-verification.txt
          grep -q "Signer #1 certificate DN: CN=Longevity Android App" apk-verification.txt
          BUILD_TOOLS_DIR=$(dirname "$APKSIGNER")
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK_PATH" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|application-label:|native-code:)" | tee -a apk-verification.txt
          cp "$APK_PATH" longevity-android-app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: longevity-android-app-apk
          path: |
            longevity-android-app.apk
            apk-verification.txt
          if-no-files-found: error
          retention-days: 30
